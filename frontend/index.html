<!DOCTYPE html>
<html>
<head>
  <title>Credit Card Default Prediction</title>
  <style>
    body { background: #fff; color: #222; font-family: Arial, sans-serif; margin: 0; padding: 2em; }
    .container { max-width: 600px; margin: auto; background: #fafafa; padding: 2em; border-radius: 8px; box-shadow: 0 2px 8px #eee; }
    h2 { text-align: center; }
    label { display: block; margin-top: 1em; }
    input, button { width: 100%; padding: 0.5em; margin-top: 0.2em; }
    #result { margin-top: 2em; font-size: 1.2em; text-align: center; }
    .explanation { font-size: 0.95em; color: #555; margin-bottom: 1em; }
    .plots { margin-top: 2em; text-align: center; }
    img { max-width: 100%; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Credit Card Default Prediction</h2>
    <div class="explanation">
      Enter the required features below. <br>
      <b>Note:</b> For demo purposes, these are technical features (e.g., V1–V28, Amount, Time). In a real app, these would be replaced with user-friendly fields.
    </div>
    <form id="predictForm">
      <label>Amount <input type="number" name="amount" required></label>
      <label>Time <input type="number" name="time" required></label>
      <label>V1 <input type="number" name="v1" required></label>
      <label>V2 <input type="number" name="v2" required></label>
      <!-- Repeat for all features up to V28 -->
      <button type="submit">Predict</button>
    </form>
    <div id="result"></div>
    <div class="plots">
      <h3>Model Performance</h3>
      <img src="roc_curve.png" alt="ROC Curve (example)">
      <img src="accuracy_plot.png" alt="Accuracy Plot (example)">
      <!-- Replace with your actual plot images -->
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
